<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<!-- Display the track name -->
			<h1>{{track.name}}</h1>
			<p>
				<!-- Link to the album page -->
				Track on <a [routerLink]="['/album', track.album.id]">{{track.album.name}}</a>
			</p>
			<div>
				<!-- Display all artists for this track -->
				@for(artist of track.artists; track artist.id) {
					<p>
						<!-- Link to the artist page -->
						Artist: <a [routerLink]="['/artist', artist.id]">{{artist.name}}</a>
					</p>
				}
			</div>
			<p>
				<!-- Show the track duration -->
				Duration: {{track.durationStr}}
			</p>
			<p>
				<!-- Link to the track on Spotify -->
				<a class="btn btn-light" role="button" [href]="track.url" target="_blank">Open {{track.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<!-- Show the track's popularity -->
			<app-thermometer [popularity]="track.popularity"></app-thermometer>
		</div>
	}
</div>
