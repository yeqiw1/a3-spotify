<!-- Load the user's profile information -->
<button class="btn btn-light" (click)="loadInfo()">Load info about me</button>

<!-- Display the username and profile picture -->
<h3>Logged in user: {{name}}</h3>
<img [src]="profile_pic" class="profile">
<p>
	<!-- Link to the user's Spotify profile -->
	<a class="btn btn-light" [href]="profile_link" target="_blank">Open profile on Spotify</a>	
</p>
